name: APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for z in *.zip; do unzip -q -o "$z"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle -p Niko-s-comic-maker/android assembleRelease --no-daemon
      - run: cp Niko-s-comic-maker/android/app/build/outputs/apk/release/app-release.apk NikoComicMaker.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          files: NikoComicMaker.apk
